packages:
  - "packages/*"
  - "apps/*"

# A version must be a week old before pnpm will pick it (minutes): a package published with malware
# is usually pulled within days (red/blue audit, 2026-11-03; Dependabot's cooldown matches).
minimumReleaseAge: 10080
# Exempt from the week: `w1913`, the maintainer's own package (the 1913 Webster's lookup, no
# dependencies), published 2026-11-28 for Definitions; the maintainer chose the exception
# (2026-11-27, DECISIONS "Definitions"). It is pinned exactly in apps/web.
minimumReleaseAgeExclude:
  - w1913

# Indirect dependencies held at a patched version (Dependabot's security alerts, 2026-11-04), where
# no direct dependency's update brings the fix in. All are build-time tools: none ships to a writer.
overrides:
  # Through listhen (Nuxt's dev server, for local HTTPS): twelve advisories, fixed in 1.4.1.
  node-forge: ^1.4.1
  # fontless's own copy (the build's font step); the rest of the build is on 0.28 already.
  fontless>esbuild: ^0.28.1
  # @nuxt/ui's own copy was 4.6.2 (GHSA-mjrq-cffv-q4qc: the dev server serves files from a parent
  # directory); the rest of the build is on 4.6.4 already.
  "@nuxt/schema": ^4.6.4

# One change to a dependency's own code, kept as a patch that `pnpm install` applies. micromark
# (the Markdown parser) merged a paragraph's runs of plain text with one `splice` for each run,
# so a manuscript pasted with single line breaks (one paragraph of 40,000 lines, a `!` or an `&`
# on each) took four seconds in the Preview and every export. The patch merges them in one pass;
# nothing else changes. Tested in packages/markdown/test/parse.test.ts, which fails without it.
# When micromark's version changes, pnpm refuses to install until this is looked at again.
patchedDependencies:
  micromark@4.0.3: patches/micromark@4.0.3.patch
