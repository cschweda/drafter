# Dependabot (security audit 2026-11-01, F4). Weekly version updates for the pnpm workspace (one
# lockfile at the root, which covers every package and app) and for the pinned GitHub Actions,
# whose update PRs keep the full commit SHA with its tag in a comment. Minor and patch updates come
# grouped, so a week brings a PR or two, not dozens; a major update comes on its own.
#
# Security updates are a repository setting (Settings → Code security → Dependabot security
# updates), turned on by the maintainer; the groups below with `applies-to: security-updates` keep
# those PRs few too. Each PR runs checks.yml; run the release gates locally before merging one too.
#
# A new version waits a week before Dependabot offers it (`cooldown`), so a package that is
# published with malware and pulled within days never reaches a PR (red/blue audit, 2026-11-03).
# pnpm-workspace.yaml's minimumReleaseAge does the same for a version picked by hand.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: docker

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        update-types: [minor, patch]
