# Hunts the page that stops dead (docs/DECISIONS.md, 2026-11-20, "A page that stops dead"): about
# one run of checks.yml in fifty has a test time out on a click or a key that never returns, a
# second or two after its page loaded. It has never happened on a writer's machine, so this runs
# the Chromium tests many times over on the runners where it does, with the hang report on
# (apps/web/e2e/fixtures.ts): a test that times out prints what its page was running, as
# `[page-stack]` in the log.
#
# By hand only (Actions → hang hunt → Run workflow), or on a pull request that changes this file.
# It reports and blocks nothing, and is to be deleted once the fault is found.
name: hang hunt

on:
  workflow_dispatch:
    inputs:
      ref:
        description: The branch to test
        default: staging
  pull_request:
    paths:
      - .github/workflows/hang-hunt.yml

permissions:
  contents: read

concurrency:
  group: hang-hunt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hunt:
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        round: [1, 2]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing here pushes: the token isn't left in .git/config.
          persist-credentials: false
          ref: ${{ inputs.ref || github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install the workspace
        run: pnpm install --frozen-lockfile
      # Some tests import the packages' builds (an export read back, a file opened), so build them.
      - name: Build the packages
        run: pnpm -r --filter "./packages/*" build
      # Chromium is kept between runs, by Playwright's version; Linux's system libraries are not
      # (they install in a few seconds, and a cache can't restore them).
      - name: Playwright's version
        id: playwright
        run: echo "version=$(pnpm --filter @drafter/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache the browser
        id: browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: The browser for the end-to-end tests
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @drafter/web exec playwright install --with-deps chromium
      - name: The browser's system libraries
        if: steps.browsers.outputs.cache-hit == 'true' && runner.os == 'Linux'
        run: pnpm --filter @drafter/web exec playwright install-deps chromium
      # Round 6 runs the whole browser; a cached install may hold only the shell.
      - name: The whole browser
        run: pnpm --filter @drafter/web exec playwright install chromium
      # For the stopped page's stack (reportLate).
      - name: gdb
        run: sudo apt-get install -y gdb || (sudo apt-get update && sudo apt-get install -y gdb)
      # Nine times in each job: the build and the browser are there already, so each further pass
      # costs only its own minutes. A failure in one pass doesn't stop the next; the job fails at
      # the end if any did, and each pass's `[page-stack]` is in the log under its own heading.
      - name: The Chromium tests, nine times
        env:
          # Round 8, this half. Round 7's pages said each call that can wait on another process,
          # and two stopped with every such call returned, both just after start-up's last one.
          # So the stop is in a call not listed, or in none (laying out, painting). The pages now
          # also say which of their own functions is running: each timer, frame, event listener,
          # handler and observer, going in and coming out.
          HANG_REPORT: crumbs
        run: |
          failed=0
          for pass in 1 2 3 4 5 6 7 8 9; do
            echo "::group::pass $pass"
            pnpm --filter @drafter/web e2e --project=chromium --grep-invert "long task|quickly|budget|within" --shard=${{ matrix.shard }}/4 || { failed=1; echo "PASS $pass FAILED"; cp -r apps/web/playwright-report "apps/web/report-pass-$pass" || true; }
            echo "::endgroup::"
          done
          exit $failed
      - name: The test report, if anything failed
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hang-hunt-${{ matrix.round }}-${{ matrix.shard }}
          path: |
            apps/web/playwright-report
            apps/web/report-pass-*
          retention-days: 7

  # Round 8, the other half: the same tests in Debian's Chromium, whose symbols Debian publishes.
  # Every stack so far is addresses in a browser without symbols, and they stop a few frames up.
  # Here a renderer whose main thread never wakes is written out whole (gcore, from the fixture),
  # and once the tests are done the symbols are installed and the stack read by name.
  hunt-symbols:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    container:
      image: debian:sid
      # gdb has to attach to a process that isn't its child, and Chromium wants more shared
      # memory than Docker's 64 MB.
      options: --cap-add=SYS_PTRACE --security-opt seccomp=unconfined --shm-size=2g
    strategy:
      fail-fast: false
      matrix:
        round: [3, 4, 5]
        shard: [1, 2, 3, 4]
    steps:
      - name: What the container lacks
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git sudo gdb procps xz-utils unzip chromium fonts-liberation fonts-noto-core
          chromium --version
          mkdir -p /tmp/hang-cores
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Install the workspace
        run: pnpm install --frozen-lockfile
      - name: Build the packages
        run: pnpm -r --filter "./packages/*" build
      - name: The Chromium tests, nine times
        env:
          HANG_REPORT: late
          HUNT_EXECUTABLE: /usr/bin/chromium
          HUNT_CORE: /tmp/hang-cores
        run: |
          failed=0
          for pass in 1 2 3 4 5 6 7 8 9; do
            echo "::group::pass $pass"
            pnpm --filter @drafter/web e2e --project=chromium --grep-invert "long task|quickly|budget|within" --shard=${{ matrix.shard }}/4 || { failed=1; echo "PASS $pass FAILED"; }
            echo "::endgroup::"
            ls -la /tmp/hang-cores
          done
          exit $failed
      - name: The stopped pages' stacks, by name
        if: always()
        run: |
          ls -la /tmp/hang-cores
          ls /tmp/hang-cores/core.* >/dev/null 2>&1 || { echo "no page was written out"; exit 0; }
          echo "deb http://deb.debian.org/debian-debug unstable-debug main" > /etc/apt/sources.list.d/debug.list
          apt-get update
          apt-get install -y chromium-dbgsym || echo "NO SYMBOLS FROM APT"
          df -h / | tail -1
          for core in /tmp/hang-cores/core.*; do
            echo "[named-stack] $core"
            timeout 3000 gdb -nx -batch -iex 'set debuginfod enabled off' /usr/lib/chromium/chromium "$core" -ex 'bt 80' -ex 'thread apply all bt 30' 2>&1 | cut -c1-400 || echo "gdb gave up on $core"
          done
