# The desktop app (Phase 1 Plan 6): build it, test it, package it, and publish it on a release.
#
#   push to main or phase-1-desktop   build, package, test the packages and the shell, on Linux
#                                     (xvfb) and Windows (x64, and the arm64 installer on Arm)
#   push of a tag v*                  the same, then publish the AppImage, the .deb,
#                                     latest-linux.yml, the two Windows installers, and latest.yml
#                                     as that tag's GitHub Release, all of them or none
#   workflow_dispatch                 the same as a branch push, for trying it by hand
#
# The `mac` job builds the Mac app as a writer builds it on their own Mac (`pnpm desktop:mac`,
# signed ad hoc) and tests it, as a check only, on branch pushes and by hand (not for a tag):
# nothing for macOS is uploaded or published until the app can be signed and notarised, and
# `publish` doesn't wait for it.
#
# The `windows` job builds both Windows installers (x64 and arm64) on x64 and tests the x64 one;
# `windows-arm` tests the arm64 one on Windows on Arm. Both are unsigned for now
# (docs/desktop-install-windows.md).
#
# To release: bump apps/desktop/package.json, merge, then push the tag (vX.Y.Z). The workflow checks
# the tag against the version, builds and tests, and makes the release itself: as a draft, with all
# its files uploaded and checked, published only then (.github/scripts/publish-release.sh). It waits
# for the Linux and both Windows jobs: if any fails, nothing is published.
#
# There is no pull_request trigger, so nothing here runs on a fork's pull request, and no job gets a
# secret other than the repository's own GITHUB_TOKEN (read-only, except in `publish`).
name: desktop

on:
  push:
    branches: [main, phase-1-desktop]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # A desktop-sized virtual screen (xvfb-run's default is 640x480, which shrinks the app's window).
  XVFB_SCREEN: "-screen 0 1920x1080x24"

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  linux:
    # Ubuntu 24.04 on purpose: it restricts unprivileged user namespaces (AppArmor), which Chromium's
    # sandbox needs, and that is what the packaged app has to cope with on a user's machine.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Cache Electron's and electron-builder's downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-

      - name: The tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but apps/desktop/package.json says $version. Bump the version, then tag."
            exit 1
          fi

      - name: System packages (a virtual display, xwininfo and xdotool, FUSE for the AppImage, the MIME database)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb x11-utils libfuse2t64 shared-mime-info xdotool

      - name: Install the workspace
        run: pnpm install --frozen-lockfile
      - name: Build the app (main process, preload, and the web build for the desktop)
        run: |
          pnpm --filter @drafter/desktop build
          pnpm --filter @drafter/desktop build:web
      - name: Package (AppImage and .deb)
        run: pnpm --filter @drafter/desktop package
      - name: The package holds what it should (app.asar)
        run: node apps/desktop/scripts/check-asar.mjs apps/desktop/release/linux-unpacked/resources/app.asar
      - name: latest-linux.yml agrees with the packages
        run: node apps/desktop/scripts/check-update-feed.mjs apps/desktop/release latest-linux.yml
      - name: The app updates from this repository's releases (resources/app-update.yml)
        run: node apps/desktop/scripts/check-update-config.mjs apps/desktop/release/linux-unpacked/resources/app-update.yml
      - name: What was built
        working-directory: apps/desktop/release
        run: |
          {
            echo "## Desktop packages"
            echo '```'
            ls -l *.AppImage *.deb latest-linux.yml | awk '{print $5, $9}'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          cat latest-linux.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-linux
          retention-days: 14
          if-no-files-found: error
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/latest-linux.yml

      # The packages as a user runs them, with Ubuntu 24.04's default restriction on unprivileged
      # user namespaces still in place.
      - name: The restriction on this runner
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          lsb_release -ds
      - name: The AppImage's desktop entry passes no --no-sandbox, takes files, and lists the script types
        working-directory: apps/desktop/release
        run: |
          chmod +x ./*.AppImage
          rm -rf "$RUNNER_TEMP/appimage" && mkdir "$RUNNER_TEMP/appimage"
          (cd "$RUNNER_TEMP/appimage" && "$GITHUB_WORKSPACE"/apps/desktop/release/*.AppImage --appimage-extract > /dev/null)
          ls "$RUNNER_TEMP/appimage/squashfs-root" | head -20
          cat "$RUNNER_TEMP/appimage"/squashfs-root/*.desktop
          entry="$(echo "$RUNNER_TEMP"/appimage/squashfs-root/*.desktop)"
          if grep -q -e '--no-sandbox' "$entry"; then echo "::error::--no-sandbox in $entry"; exit 1; fi
          # electron-builder writes `AppRun %U` for an AppImage (the app opens local file:// URLs too).
          grep -qx 'Exec=AppRun %U' "$entry"
          grep -q '^MimeType=.*text/x-fountain;' "$entry"
          grep -q '^MimeType=.*text/markdown;' "$entry"
      - name: Packaged AppImage, with the restriction on (its launcher drops the sandbox, so the app asks first)
        if: ${{ !cancelled() }}
        run: |
          DRAFTER_PACKAGED_KIND=appimage DRAFTER_PACKAGED="$(echo "$GITHUB_WORKSPACE"/apps/desktop/release/*.AppImage)" \
            xvfb-run -a -s "$XVFB_SCREEN" pnpm --filter @drafter/desktop e2e:packaged
      - name: Install the .deb
        if: ${{ !cancelled() }}
        run: |
          sudo apt-get install -y -q ./apps/desktop/release/*.deb
          ls -l /etc/apparmor.d/drafterdev /usr/bin/drafterdev
          cat /etc/apparmor.d/drafterdev
          sudo aa-status 2>/dev/null | grep -i drafterdev || echo "(aa-status shows no drafterdev profile)"
      - name: Packaged .deb, with the restriction on (its AppArmor profile allows the sandbox; real keys by xdotool; SIGTERM)
        if: ${{ !cancelled() }}
        run: |
          DRAFTER_XDOTOOL=1 DRAFTER_PACKAGED_KIND=deb DRAFTER_PACKAGED=/usr/bin/drafterdev \
            xvfb-run -a -s "$XVFB_SCREEN" pnpm --filter @drafter/desktop e2e:packaged
      - name: Packaged AppImage, with a narrow AppArmor profile for its own path (the fix in the docs; restriction still on)
        if: ${{ !cancelled() }}
        run: |
          set +e
          image="$(echo "$GITHUB_WORKSPACE"/apps/desktop/release/*.AppImage)"
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\n\nprofile drafter-appimage %s flags=(default_allow) {\n  userns,\n}\n' "$image" | sudo tee /etc/apparmor.d/drafter-appimage
          sudo apparmor_parser -r /etc/apparmor.d/drafter-appimage
          sysctl kernel.apparmor_restrict_unprivileged_userns
          DRAFTER_APPIMAGE_PROFILED=1 DRAFTER_PACKAGED_KIND=appimage DRAFTER_PACKAGED="$image" \
            xvfb-run -a -s "$XVFB_SCREEN" pnpm --filter @drafter/desktop e2e:packaged -g "runs sandboxed|launches"
          status=$?
          sudo apparmor_parser -R /etc/apparmor.d/drafter-appimage || true
          sudo rm -f /etc/apparmor.d/drafter-appimage
          exit $status
      - name: The unpacked build's fuses (the AppImage's binary is inside its image)
        if: ${{ !cancelled() }}
        run: |
          DRAFTER_PACKAGED_KIND=unpacked DRAFTER_PACKAGED="$GITHUB_WORKSPACE/apps/desktop/release/linux-unpacked/drafterdev" \
            xvfb-run -a -s "$XVFB_SCREEN" pnpm --filter @drafter/desktop e2e:packaged -g "Electron’s fuses"

      # The shell's own tests launch node_modules' Electron, which has no AppArmor profile: lift the
      # restriction for them, after the packages have been tried without.
      - name: Allow unprivileged user namespaces, for the unpackaged shell's tests
        if: ${{ !cancelled() }}
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Packaged AppImage, with user namespaces allowed (sandboxed, end to end)
        if: ${{ !cancelled() }}
        run: |
          DRAFTER_PACKAGED_KIND=appimage DRAFTER_PACKAGED="$(echo "$GITHUB_WORKSPACE"/apps/desktop/release/*.AppImage)" \
            xvfb-run -a -s "$XVFB_SCREEN" pnpm --filter @drafter/desktop e2e:packaged
      # An update, for real: two AppImages built for the test (1.0.0 and 1.0.1, the release's own
      # configuration with a feed on this machine, e2e/update-test.builder.cjs). 1.0.0 finds 1.0.1,
      # downloads it, and Restart on its page runs electron-updater's own quitAndInstall: the file
      # must be replaced at the same path and the new version must start from it.
      - name: Two AppImages for the update test (1.0.0 and 1.0.1, with a feed on this machine)
        if: ${{ !cancelled() }}
        working-directory: apps/desktop
        run: |
          for version in 1.0.0 1.0.1; do
            DRAFTER_TEST_VERSION=$version DRAFTER_TEST_FEED=http://127.0.0.1:47613/ \
              DRAFTER_TEST_OUTPUT="$RUNNER_TEMP/update-$version" \
              pnpm exec electron-builder --config e2e/update-test.builder.cjs --linux --publish never
          done
          ls -l "$RUNNER_TEMP"/update-1.0.0/*.AppImage "$RUNNER_TEMP"/update-1.0.1/*.AppImage
          cat "$RUNNER_TEMP/update-1.0.1/latest-linux.yml"
          node scripts/check-update-feed.mjs "$RUNNER_TEMP/update-1.0.1"
      - name: An AppImage replaces itself in place on Restart (the real electron-updater swap)
        if: ${{ !cancelled() }}
        run: |
          DRAFTER_UPDATE_OLD="$RUNNER_TEMP/update-1.0.0" DRAFTER_UPDATE_NEW="$RUNNER_TEMP/update-1.0.1" \
            DRAFTER_UPDATE_PORT=47613 DRAFTER_PACKAGED_KIND=appimage \
            DRAFTER_PACKAGED="$RUNNER_TEMP/update-1.0.0/Drafter-x86_64.AppImage" \
            xvfb-run -a -s "$XVFB_SCREEN" pnpm --filter @drafter/desktop e2e:packaged -g "replaces itself"
      - name: Chromium for the web side of the files test (e2e/interchange.spec.ts)
        if: ${{ !cancelled() }}
        run: pnpm --filter @drafter/desktop exec playwright install --with-deps chromium
      - name: The shell's end-to-end tests
        if: ${{ !cancelled() }}
        env:
          DRAFTER_E2E_REUSE_WEB: "1"
        run: xvfb-run -a -s "$XVFB_SCREEN" pnpm --filter @drafter/desktop e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: desktop-test-results
          retention-days: 7
          path: apps/desktop/test-results

  windows:
    # Builds both installers (x64, and arm64 by cross-building, which electron-builder does on x64)
    # and tests the x64 one here; `windows-arm` tests the arm64 one.
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      # The files as they are in the repository (the runner's git would turn LF into CRLF).
      - name: Check out without changing line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Cache Electron's and electron-builder's downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-${{ runner.arch }}-
      - name: The tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but apps/desktop/package.json says $version. Bump the version, then tag."
            exit 1
          fi
      - name: Install the workspace
        run: pnpm install --frozen-lockfile
      - name: The shell's unit tests, on Windows
        run: pnpm --filter @drafter/desktop test
      - name: Build the app (main process, preload, and the web build for the desktop)
        run: |
          pnpm --filter @drafter/desktop build
          pnpm --filter @drafter/desktop build:web
      - name: Package (an NSIS installer for x64 and one for arm64)
        run: pnpm --filter @drafter/desktop package:win
      - name: The packages hold what they should (app.asar), and update from this repository's releases
        run: |
          for unpacked in win-unpacked win-arm64-unpacked; do
            node apps/desktop/scripts/check-asar.mjs "apps/desktop/release/$unpacked/resources/app.asar"
            node apps/desktop/scripts/check-update-config.mjs "apps/desktop/release/$unpacked/resources/app-update.yml"
            cat "apps/desktop/release/$unpacked/resources/app-update.yml"
          done
      - name: latest.yml agrees with the installers
        run: node apps/desktop/scripts/check-update-feed.mjs apps/desktop/release latest.yml
      - name: What was built
        working-directory: apps/desktop/release
        run: |
          {
            echo "## Windows installers (unsigned)"
            echo '```'
            ls -l ./*.exe latest.yml | awk '{print $5, $9}'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          cat latest.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-windows
          retention-days: 14
          if-no-files-found: error
          path: |
            apps/desktop/release/*-windows-*-setup.exe
            apps/desktop/release/latest.yml
      - name: The x64 installer (install, the file types, a file from the command line, uninstall)
        if: ${{ !cancelled() }}
        run: |
          DRAFTER_PACKAGED="$(cygpath -w "$(echo "$GITHUB_WORKSPACE"/apps/desktop/release/*-windows-x64-setup.exe)")" \
            pnpm --filter @drafter/desktop e2e:packaged
      # An update, for real: two installers built for the test (1.0.0 and 1.0.1, the release's own
      # configuration with a feed on this machine). 1.0.0 finds 1.0.1, downloads it, checks it, and
      # Restart runs electron-updater's own quitAndInstall: the new installer must replace it and
      # start 1.0.1.
      - name: Two installers for the update test (1.0.0 and 1.0.1, with a feed on this machine)
        if: ${{ !cancelled() }}
        working-directory: apps/desktop
        run: |
          for version in 1.0.0 1.0.1; do
            DRAFTER_TEST_VERSION=$version DRAFTER_TEST_FEED=http://127.0.0.1:47614/ \
              DRAFTER_TEST_OUTPUT="$RUNNER_TEMP/update-$version" \
              pnpm exec electron-builder --config e2e/update-test.builder.cjs --win --publish never
          done
          ls -l "$RUNNER_TEMP"/update-1.0.0/*.exe "$RUNNER_TEMP"/update-1.0.1/*.exe
          cat "$RUNNER_TEMP/update-1.0.1/latest.yml"
          node scripts/check-update-feed.mjs "$RUNNER_TEMP/update-1.0.1" latest.yml
      - name: An installed Drafter updates itself on Restart (the real electron-updater install)
        if: ${{ !cancelled() }}
        run: |
          DRAFTER_UPDATE_OLD="$(cygpath -w "$RUNNER_TEMP/update-1.0.0")" DRAFTER_UPDATE_NEW="$(cygpath -w "$RUNNER_TEMP/update-1.0.1")" \
            DRAFTER_UPDATE_PORT=47614 \
            DRAFTER_PACKAGED="$(cygpath -w "$(echo "$GITHUB_WORKSPACE"/apps/desktop/release/*-windows-x64-setup.exe)")" \
            pnpm --filter @drafter/desktop e2e:packaged -g "updates itself"
      - name: Chromium for the web side of the files test (e2e/interchange.spec.ts)
        if: ${{ !cancelled() }}
        run: pnpm --filter @drafter/desktop exec playwright install chromium
      # The runner's screen is 1024 x 768, which shrinks the app's 1280 x 860 window below the
      # editor's two-pane width (as xvfb's default does on Linux).
      - name: A desktop-sized screen
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
      - name: The shell's end-to-end tests, on Windows
        if: ${{ !cancelled() }}
        env:
          DRAFTER_E2E_REUSE_WEB: "1"
        run: pnpm --filter @drafter/desktop e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: desktop-test-results-windows
          retention-days: 7
          path: apps/desktop/test-results

  windows-arm:
    # The arm64 installer, built by `windows`, on Windows on Arm: as on a Snapdragon laptop, or
    # Windows 11 in a VM on an Apple silicon Mac. A release waits for it too.
    needs: windows
    runs-on: windows-11-arm
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out without changing line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Cache Electron's and electron-builder's downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-${{ runner.arch }}-
      - name: Install the workspace
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-windows
          path: windows-release
      - name: The arm64 installer, on Arm (install, the file types, a file from the command line, uninstall)
        run: |
          uname -m
          DRAFTER_PACKAGED="$(cygpath -w "$(echo "$GITHUB_WORKSPACE"/windows-release/*-windows-arm64-setup.exe)")" \
            pnpm --filter @drafter/desktop e2e:packaged
      - name: Build the app, for the update test's installers
        if: ${{ !cancelled() }}
        run: |
          pnpm --filter @drafter/desktop build
          pnpm --filter @drafter/desktop build:web
      - name: Two arm64 installers for the update test (1.0.0 and 1.0.1)
        if: ${{ !cancelled() }}
        working-directory: apps/desktop
        run: |
          for version in 1.0.0 1.0.1; do
            DRAFTER_TEST_VERSION=$version DRAFTER_TEST_FEED=http://127.0.0.1:47614/ \
              DRAFTER_TEST_OUTPUT="$RUNNER_TEMP/update-$version" \
              pnpm exec electron-builder --config e2e/update-test.builder.cjs --win --publish never
          done
          node scripts/check-update-feed.mjs "$RUNNER_TEMP/update-1.0.1" latest.yml
      - name: An installed Drafter updates itself on Restart, on Arm
        if: ${{ !cancelled() }}
        run: |
          DRAFTER_UPDATE_OLD="$(cygpath -w "$RUNNER_TEMP/update-1.0.0")" DRAFTER_UPDATE_NEW="$(cygpath -w "$RUNNER_TEMP/update-1.0.1")" \
            DRAFTER_UPDATE_PORT=47614 \
            DRAFTER_PACKAGED="$(cygpath -w "$(echo "$GITHUB_WORKSPACE"/windows-release/*-windows-arm64-setup.exe)")" \
            pnpm --filter @drafter/desktop e2e:packaged -g "updates itself"

  mac:
    # Apple silicon, as most Macs a writer builds on now are. A check, never a release: not run for
    # a tag, so a release's run is the Linux job and publish alone.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Cache Electron's and electron-builder's downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-
      - name: Install the workspace
        run: pnpm install --frozen-lockfile
      - name: Build the Mac app, as docs/desktop-install-macos.md says to
        run: pnpm desktop:mac
      - name: The package holds what it should (app.asar)
        run: node apps/desktop/scripts/check-asar.mjs apps/desktop/release/mac-arm64/Drafter.app/Contents/Resources/app.asar
      - name: What was built
        working-directory: apps/desktop/release
        run: |
          {
            echo "## The Mac app (a check; not published)"
            echo '```'
            du -sh mac-arm64/Drafter.app
            ls -l ./*.dmg | awk '{print $5, $9}'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The built app (signed ad hoc, its file types, its fuses, a file opened as Finder opens one)
        run: DRAFTER_PACKAGED="$GITHUB_WORKSPACE/apps/desktop/release/mac-arm64/Drafter.app" pnpm --filter @drafter/desktop e2e:packaged
      - name: Chromium for the web side of the files test (e2e/interchange.spec.ts)
        if: ${{ !cancelled() }}
        run: pnpm --filter @drafter/desktop exec playwright install chromium
      - name: The shell's end-to-end tests, on macOS (mac.spec.ts among them)
        if: ${{ !cancelled() }}
        env:
          DRAFTER_E2E_REUSE_WEB: "1"
        run: pnpm --filter @drafter/desktop e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: desktop-test-results-mac
          retention-days: 7
          path: apps/desktop/test-results

  publish:
    # Only for a tag, only after the Linux and both Windows jobs passed (the Mac job is a check, and
    # publishes nothing). This is the one job that can write.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, windows-arm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-linux
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-windows
          path: release
      - name: Publish the release (a draft, filled and checked, then published)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l release
          .github/scripts/publish-release.sh "$GITHUB_REF_NAME" release
