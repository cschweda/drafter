# The checks on every pull request: Dependabot's updates and anyone else's. The same gates a release
# runs, on Linux, minus packaging the desktop app (desktop.yml does that on main and on tags):
# formatting and lint, the build, every package's typecheck and tests, the trap documents, the web app's
# typecheck and unit tests, the desktop shell's unit tests, and the browser tests in Chromium on
# macOS and Linux. Every job is meant to be required: GitHub enforces that only once a ruleset on
# main requires the `e2e` check (docs/DEFERRED.md, red/blue audit 2026-11-03).
#
# It uses no secret. A pull request from a fork, or from Dependabot, gets a read-only token.
name: checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing here pushes: the token isn't left in .git/config.
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install the workspace
        run: pnpm install --frozen-lockfile
      - name: Formatting and lint
        run: pnpm check
      - name: Build (packages and the web app, as Netlify builds it)
        env:
          NETLIFY: "true"
        run: pnpm build
      - name: Every package's typecheck
        # Each package's tests run its source through Vitest, which strips types without checking
        # them; tsc --noEmit is what catches a type error in a package.
        run: pnpm -r --filter "./packages/*" typecheck
      - name: Every package's tests
        # A shared runner is slower and noisier than a writer's computer. The tests with a fixed time
        # limit ("within 3 seconds", "under 50 ms", "in under a second") are left to the release gates,
        # which run every test once on a real machine; the tests that compare n with 4n or 8n, which
        # catch a slowdown on any machine, run here, with two more tries for noise.
        env:
          NO_FIXED_LIMITS: '^(?!.*\b(within|under) (a |an |[0-9]))'
        run: pnpm -r --workspace-concurrency=1 --filter "./packages/*" test --retry=2 -t "$NO_FIXED_LIMITS"
      - name: The trap documents (fixtures/trap/README.md)
        env:
          NO_FIXED_LIMITS: '^(?!.*\b(within|under) (a |an |[0-9]))'
        run: |
          pnpm --filter "@drafter/cli..." build
          pnpm exec vitest run --project trap --retry=2 -t "$NO_FIXED_LIMITS"
      - name: The web app's typecheck
        run: pnpm --filter @drafter/web typecheck
      - name: The web app's unit tests
        env:
          NO_FIXED_LIMITS: '^(?!.*\b(within|under) (a |an |[0-9]))'
        run: pnpm --filter @drafter/web exec vitest run --retry=2 -t "$NO_FIXED_LIMITS"
      - name: The desktop shell's unit tests
        run: pnpm --filter @drafter/desktop test

  # The browser tests, in Chromium, on macOS (the fonts the layouts were written against) and on Linux,
  # each split across four runners: one runner took about 55 minutes. The tests that time typing or
  # drawing against a fixed limit ("long task", "quickly", "budget", "within") are left to the release
  # gate, which runs the full suite on all five browser projects on a real machine; everything else
  # is required here. docs/DECISIONS.md, 2026-11-02.
  e2e:
    name: e2e (${{ matrix.os }}, ${{ matrix.shard }}/4)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      # Every shard runs to the end, so one run shows every failure.
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing here pushes: the token isn't left in .git/config.
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install the workspace
        run: pnpm install --frozen-lockfile
      # Some tests import the packages' builds (an export read back, a file opened), so build them.
      - name: Build the packages
        run: pnpm -r --filter "./packages/*" build
      # Chromium is kept between runs, by Playwright's version; Linux's system libraries are not
      # (they install in a few seconds, and a cache can't restore them).
      - name: Playwright's version
        id: playwright
        run: echo "version=$(pnpm --filter @drafter/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache the browser
        id: browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: The browser for the end-to-end tests
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @drafter/web exec playwright install --with-deps chromium
      - name: The browser's system libraries
        if: steps.browsers.outputs.cache-hit == 'true' && runner.os == 'Linux'
        run: pnpm --filter @drafter/web exec playwright install-deps chromium
      - name: The web app's end-to-end tests, in Chromium
        run: pnpm --filter @drafter/web e2e --project=chromium --grep-invert "long task|quickly|budget|within" --shard=${{ matrix.shard }}/4
      - name: The test report, if anything failed
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ runner.os }}-${{ matrix.shard }}
          path: apps/web/playwright-report
          retention-days: 7

  # The self-hosted image (Dockerfile, compose.yaml): it builds, starts as compose starts it, and
  # serves the app with drafter.dev's headers and no analytics.
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build and start the container
        run: docker compose up -d --build --wait --wait-timeout 60 || { docker compose logs; exit 1; }
      - name: It serves the app, its help, and its headers
        run: |
          set -e -o pipefail
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 http://localhost:8080/ -o index.html
          grep -q '<title>' index.html
          if grep -q plausible index.html; then exit 1; fi
          curl -fsS http://localhost:8080/docs/privacy/ -o /dev/null
          curl -fsS http://localhost:8080/docs/privacy -o /dev/null -L
          curl -fsSI http://localhost:8080/ | tee headers.txt
          grep -qi '^content-security-policy: default-src' headers.txt
          if grep -qi plausible headers.txt; then exit 1; fi
          curl -fsSI http://localhost:8080/sw.js | grep -qi '^cache-control: no-cache'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/_headers)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/no-such-page)" = 404
      - name: The container's log, if it failed
        if: failure()
        run: docker compose logs

  # One check over the checks job and the eight shards, to require by name. Each must have succeeded:
  # one skipped, cancelled, or failed fails it.
  e2e-all:
    name: e2e
    if: always()
    needs: [checks, e2e, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: The checks and every shard passed
        run: |
          test "${{ needs.checks.result }}" = success
          test "${{ needs.e2e.result }}" = success
          test "${{ needs.docker.result }}" = success
